<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScentGuessr - Fragrance Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <style>
        .reveal-node { animation: slideIn 0.4s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-white border-b sticky top-0 z-40 p-4 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-indigo-600 flex items-center gap-2">
                <i data-lucide="droplets"></i> SCENTGUESSR
            </h1>
            <div class="bg-slate-100 px-4 py-1 rounded-full font-bold text-slate-600">
                Score: <span id="total-score" class="text-indigo-600">0</span>
            </div>
        </div>
    </nav>

    <main class="max-w-xl mx-auto p-4 pt-8">
        
        <div class="bg-white rounded-[2rem] shadow-xl border border-slate-200 overflow-hidden">
            
            <!-- Points Header -->
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center px-8">
                <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Round Points</span>
                <span id="round-points" class="font-mono text-xl font-bold text-amber-400">5000</span>
            </div>

            <!-- Hint Sections -->
            <div class="p-8 space-y-8">
                
                <!-- Accords (Hint 1) -->
                <section>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Main Accords</h3>
                    <div id="accords-list" class="flex flex-wrap gap-2">
                        <!-- Filled by JS -->
                    </div>
                </section>

                <!-- Top Notes (Hint 2) -->
                <section id="hint-2" class="hidden reveal-node border-t pt-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Top Notes</h3>
                    <p id="top-notes" class="text-lg font-semibold text-slate-800"></p>
                </section>

                <!-- Heart/Base (Hint 3) -->
                <section id="hint-3" class="hidden reveal-node border-t pt-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Heart & Base Notes</h3>
                    <div class="space-y-1">
                        <p id="mid-notes" class="text-slate-600 italic text-sm"></p>
                        <p id="base-notes" class="text-slate-800 font-medium"></p>
                    </div>
                </section>

                <!-- Brand/Year (Hint 4) -->
                <section id="hint-4" class="hidden reveal-node border-t pt-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2">Fragrance Brand</h3>
                    <p id="brand-info" class="text-3xl font-black text-indigo-900"></p>
                </section>
            </div>

            <!-- Input / Search Area -->
            <div class="p-8 bg-slate-50 border-t space-y-4">
                <div class="relative">
                    <input type="text" id="guess-input" autocomplete="off"
                        placeholder="Type to search fragrances..." 
                        class="w-full p-5 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition-all text-lg">
                    
                    <!-- Search Results -->
                    <div id="autocomplete-list" class="absolute z-10 w-full mt-2 bg-white border rounded-xl shadow-2xl max-h-60 overflow-y-auto hidden custom-scroll"></div>
                </div>

                <button onclick="revealHint()" id="hint-btn" class="w-full py-4 rounded-xl font-bold text-slate-500 border-2 border-dashed border-slate-300 hover:border-indigo-400 hover:text-indigo-600 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="help-circle" size="18"></i> Need a hint? (-1250 pts)
                </button>
            </div>
        </div>
    </main>

    <!-- Success Modal -->
    <div id="modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-[2.5rem] p-10 max-w-sm w-full text-center shadow-2xl">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="award" size="40"></i>
            </div>
            <h2 class="text-3xl font-black mb-2">Spot on!</h2>
            <p id="correct-answer" class="text-slate-500 mb-8 font-medium italic"></p>
            <button onclick="startNewRound()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold text-lg hover:bg-indigo-700">
                NEXT ROUND
            </button>
        </div>
    </div>

    <script>
        let fragrances = [];
        let currentFrag = null;
        let currentHint = 1;
        let score = 5000;
        let totalScore = 0;
        let fuse = null;

        // LOAD DATA
        async function loadGame() {
            try {
                const response = await fetch('data.json');
                fragrances = await response.json();
                
                // Initialize Fuzzy Search (Matching spreadsheet columns)
                fuse = new Fuse(fragrances, {
                    keys: ['Perfume', 'Brand'],
                    threshold: 0.3
                });

                startNewRound();
                setupSearch();
            } catch (err) {
                console.error("Error loading data.json:", err);
                alert("Failed to load fragrance data. Check if data.json is in the repo!");
            }
        }

        function startNewRound() {
            currentFrag = fragrances[Math.floor(Math.random() * fragrances.length)];
            currentHint = 1;
            score = 5000;
            
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('guess-input').value = "";
            document.getElementById('round-points').innerText = "5000";
            document.getElementById('hint-btn').disabled = false;
            document.getElementById('hint-btn').style.opacity = "1";

            // Populate Accords (mainaccord1 to mainaccord5)
            const list = document.getElementById('accords-list');
            list.innerHTML = '';
            for(let i=1; i<=5; i++) {
                const val = currentFrag[`mainaccord${i}`];
                if(val) list.innerHTML += `<span class="px-3 py-1.5 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-bold border border-indigo-100">${val}</span>`;
            }

            // Prepare Hidden Hints
            document.getElementById('top-notes').innerText = currentFrag.Top || "N/A";
            document.getElementById('mid-notes').innerText = "Middle: " + (currentFrag.Middle || "N/A");
            document.getElementById('base-notes').innerText = "Base: " + (currentFrag.Base || "N/A");
            document.getElementById('brand-info').innerText = `${currentFrag.Brand} (${currentFrag.Year || '?'})`;

            for(let i=2; i<=4; i++) document.getElementById(`hint-${i}`).classList.add('hidden');
            lucide.createIcons();
        }

        function revealHint() {
            if (currentHint < 4) {
                currentHint++;
                score -= 1250;
                document.getElementById(`hint-${currentHint}`).classList.remove('hidden');
                document.getElementById('round-points').innerText = score;
            }
            if (currentHint === 4) {
                document.getElementById('hint-btn').disabled = true;
                document.getElementById('hint-btn').style.opacity = "0.3";
            }
        }

        function setupSearch() {
            const input = document.getElementById('guess-input');
            const list = document.getElementById('autocomplete-list');

            input.addEventListener('input', () => {
                const query = input.value;
                if (query.length < 2) {
                    list.classList.add('hidden');
                    return;
                }

                const results = fuse.search(query).slice(0, 5);
                if (results.length > 0) {
                    list.innerHTML = results.map(r => `
                        <div class="p-4 hover:bg-indigo-50 cursor-pointer border-b last:border-0" onclick="checkGuess('${r.item.Perfume.replace(/'/g, "\\'")}')">
                            <div class="font-bold text-slate-800">${r.item.Perfume}</div>
                            <div class="text-[10px] text-slate-400 uppercase font-black">${r.item.Brand}</div>
                        </div>
                    `).join('');
                    list.classList.remove('hidden');
                }
            });
        }

        function checkGuess(guess) {
            document.getElementById('autocomplete-list').classList.add('hidden');
            if (guess.toLowerCase() === currentFrag.Perfume.toLowerCase()) {
                totalScore += score;
                document.getElementById('total-score').innerText = totalScore;
                document.getElementById('correct-answer').innerText = `${currentFrag.Brand} - ${currentFrag.Perfume}`;
                document.getElementById('modal').classList.remove('hidden');
            } else {
                alert("Not quite! Try another hint or a different fragrance.");
            }
        }

        // Close search on click outside
        window.onclick = (e) => {
            if (!e.target.matches('#guess-input')) {
                document.getElementById('autocomplete-list').classList.add('hidden');
            }
        };

        loadGame();
        lucide.createIcons();
    </script>
</body>
</html>
