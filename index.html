<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmellGuessr - The Fragrance Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
    <style>
        .note-pill { transition: all 0.2s; cursor: default; }
        .note-pill:hover { transform: scale(1.05); }
        .reveal-anim { animation: zoomIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-20">

    <!-- Header -->
    <nav class="bg-white/80 backdrop-blur-md border-b sticky top-0 z-40 p-4 shadow-sm">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-indigo-600 flex items-center gap-2 tracking-tighter">
                <i data-lucide="sparkles"></i> SMELLGUESSR
            </h1>
            <div class="flex gap-4 items-center">
                <div class="text-xs font-bold uppercase text-slate-400">Total Score: <span id="total-score" class="text-indigo-600 text-lg ml-1">0</span></div>
            </div>
        </div>
    </nav>

    <main class="max-w-xl mx-auto p-4 pt-8">
        
        <!-- Game Status -->
        <div class="flex justify-between items-end mb-4 px-2">
            <div>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Lives Remaining</p>
                <div id="lives-container" class="flex gap-1 text-rose-500">
                    <i data-lucide="heart" fill="currentColor"></i>
                    <i data-lucide="heart" fill="currentColor"></i>
                    <i data-lucide="heart" fill="currentColor"></i>
                    <i data-lucide="heart" fill="currentColor"></i>
                    <i data-lucide="heart" fill="currentColor"></i>
                </div>
            </div>
            <div class="text-right">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Potential</p>
                <p id="round-points" class="text-2xl font-black text-amber-500">5000</p>
            </div>
        </div>

        <div class="bg-white rounded-[2.5rem] shadow-2xl shadow-indigo-100 border border-slate-200 overflow-hidden">
            
            <!-- Hint Sections -->
            <div class="p-8 space-y-8">
                
                <!-- Hint 1: Accords -->
                <section>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i data-lucide="wind" size="14"></i> Main Accords
                    </h3>
                    <div id="accords-list" class="flex flex-wrap gap-2"></div>
                </section>

                <!-- Hint 2: Top Notes -->
                <section id="hint-2" class="hidden reveal-anim border-t pt-6">
                    <h3 class="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i data-lucide="arrow-up-circle" size="14"></i> Top Notes
                    </h3>
                    <div id="top-notes-pills" class="flex flex-wrap gap-2"></div>
                </section>

                <!-- Hint 3: Heart/Base -->
                <section id="hint-3" class="hidden reveal-anim border-t pt-6 space-y-6">
                    <div>
                        <h3 class="text-[10px] font-black text-rose-400 uppercase tracking-widest mb-4">Heart Notes</h3>
                        <div id="mid-notes-pills" class="flex flex-wrap gap-2"></div>
                    </div>
                    <div>
                        <h3 class="text-[10px] font-black text-amber-600 uppercase tracking-widest mb-4">Base Notes</h3>
                        <div id="base-notes-pills" class="flex flex-wrap gap-2"></div>
                    </div>
                </section>

                <!-- Hint 4: Brand -->
                <section id="hint-4" class="hidden reveal-anim border-t pt-6">
                    <h3 class="text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-2 italic">The House</h3>
                    <p id="brand-info" class="text-4xl font-black text-slate-900 tracking-tighter"></p>
                </section>
            </div>

            <!-- Input / Search Area -->
            <div class="p-8 bg-slate-50 border-t space-y-4">
                <div class="relative">
                    <input type="text" id="guess-input" autocomplete="off"
                        placeholder="Search for a perfume..." 
                        class="w-full p-5 rounded-2xl border-2 border-slate-200 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition-all text-lg shadow-inner">
                    <div id="autocomplete-list" class="absolute z-10 w-full mt-2 bg-white border rounded-xl shadow-2xl max-h-60 overflow-y-auto hidden custom-scroll"></div>
                </div>

                <div class="flex gap-2">
                    <button onclick="revealHint()" id="hint-btn" class="flex-[2] py-4 rounded-xl font-bold text-slate-600 bg-white border-2 border-slate-200 hover:border-indigo-400 transition-all flex items-center justify-center gap-2">
                        <i data-lucide="help-circle" size="18"></i> Hint (-1250)
                    </button>
                    <button onclick="giveUp()" class="flex-1 py-4 rounded-xl font-bold text-rose-500 bg-rose-50 border-2 border-rose-100 hover:bg-rose-100 transition-all">
                        Give Up
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Success Modal (Win) -->
    <div id="win-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-[3rem] p-10 max-w-sm w-full text-center shadow-2xl">
            <div class="w-24 h-24 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="trophy" size="48"></i>
            </div>
            <h2 class="text-3xl font-black mb-2 text-slate-900">Great Nose!</h2>
            <p id="win-name" class="text-indigo-600 font-bold mb-1"></p>
            <p class="text-slate-400 mb-8 text-sm">Correct answer identified.</p>
            <button onclick="startNewRound()" class="w-full bg-indigo-600 text-white py-5 rounded-2xl font-bold text-lg hover:bg-indigo-700 shadow-lg shadow-indigo-200">
                PLAY NEXT ROUND
            </button>
        </div>
    </div>

    <!-- Lose Modal (Game Over) -->
    <div id="lose-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-[3rem] p-10 max-w-sm w-full text-center">
            <div class="w-24 h-24 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="x-circle" size="48"></i>
            </div>
            <h2 class="text-3xl font-black mb-2">Game Over</h2>
            <p class="text-slate-500 mb-2">The fragrance was:</p>
            <p id="lose-name" class="text-xl font-bold text-slate-900 mb-8"></p>
            <button onclick="startNewRound()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold text-lg hover:bg-black">
                TRY AGAIN
            </button>
        </div>
    </div>

    <script>
        let fragrances = [];
        let currentFrag = null;
        let currentHint = 1;
        let score = 5000;
        let totalScore = 0;
        let lives = 5;
        let fuse = null;

        async function loadGame() {
            try {
                const response = await fetch('data.json');
                fragrances = await response.json();
                fuse = new Fuse(fragrances, { keys: ['Perfume', 'Brand'], threshold: 0.3 });
                startNewRound();
                setupSearch();
            } catch (err) { alert("Error loading data.json!"); }
        }

        function startNewRound() {
            currentFrag = fragrances[Math.floor(Math.random() * fragrances.length)];
            currentHint = 1;
            score = 5000;
            lives = 5;
            
            document.getElementById('win-modal').classList.add('hidden');
            document.getElementById('lose-modal').classList.add('hidden');
            document.getElementById('guess-input').value = "";
            document.getElementById('round-points').innerText = "5000";
            document.getElementById('hint-btn').disabled = false;
            document.getElementById('hint-btn').style.opacity = "1";

            renderLives();

            // Populate Accords
            const accList = document.getElementById('accords-list');
            accList.innerHTML = '';
            for(let i=1; i<=5; i++) {
                const val = currentFrag[`mainaccord${i}`];
                if(val) accList.innerHTML += `<span class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl text-xs font-black border border-slate-200 uppercase">${val}</span>`;
            }

            // Populate Note Pills
            renderPills('top-notes-pills', currentFrag.Top, 'bg-blue-50 text-blue-600 border-blue-100');
            renderPills('mid-notes-pills', currentFrag.Middle, 'bg-rose-50 text-rose-600 border-rose-100');
            renderPills('base-notes-pills', currentFrag.Base, 'bg-amber-50 text-amber-700 border-amber-100');
            
            document.getElementById('brand-info').innerText = currentFrag.Brand;

            for(let i=2; i<=4; i++) document.getElementById(`hint-${i}`).classList.add('hidden');
            lucide.createIcons();
        }

        function renderPills(containerId, notesString, classes) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if(!notesString) return;
            notesString.split(',').forEach(note => {
                container.innerHTML += `<span class="note-pill px-3 py-1.5 rounded-lg border text-sm font-medium ${classes}">${note.trim()}</span>`;
            });
        }

        function renderLives() {
            const container = document.getElementById('lives-container');
            container.innerHTML = '';
            for(let i=0; i<5; i++) {
                container.innerHTML += `<i data-lucide="heart" size="20" class="${i < lives ? 'fill-rose-500' : 'text-slate-200'}"></i>`;
            }
            lucide.createIcons();
        }

        function revealHint() {
            if (currentHint < 4) {
                currentHint++;
                score -= 1250;
                document.getElementById(`hint-${currentHint}`).classList.remove('hidden');
                document.getElementById('round-points').innerText = score;
            }
            if (currentHint === 4) {
                document.getElementById('hint-btn').disabled = true;
                document.getElementById('hint-btn').style.opacity = "0.3";
            }
        }

        function giveUp() {
            score = 0;
            showEndModal(false);
        }

        function setupSearch() {
            const input = document.getElementById('guess-input');
            const list = document.getElementById('autocomplete-list');

            input.addEventListener('input', () => {
                const query = input.value;
                if (query.length < 2) { list.classList.add('hidden'); return; }
                const results = fuse.search(query).slice(0, 5);
                if (results.length > 0) {
                    list.innerHTML = results.map(r => `
                        <div class="p-4 hover:bg-indigo-50 cursor-pointer border-b last:border-0 flex justify-between items-center" onclick="checkGuess('${r.item.Perfume.replace(/'/g, "\\'")}')">
                            <div>
                                <div class="font-bold text-slate-800">${r.item.Perfume}</div>
                                <div class="text-[10px] text-slate-400 uppercase font-black tracking-widest">${r.item.Brand}</div>
                            </div>
                            <i data-lucide="chevron-right" size="14" class="text-slate-300"></i>
                        </div>
                    `).join('');
                    list.classList.remove('hidden');
                    lucide.createIcons();
                }
            });
        }

        function checkGuess(guess) {
            document.getElementById('autocomplete-list').classList.add('hidden');
            if (guess.toLowerCase() === currentFrag.Perfume.toLowerCase()) {
                totalScore += score;
                document.getElementById('total-score').innerText = totalScore;
                showEndModal(true);
            } else {
                lives--;
                renderLives();
                if(lives <= 0) showEndModal(false);
                else alert("Incorrect! Try again. Lives left: " + lives);
            }
        }

        function showEndModal(isWin) {
            if(isWin) {
                document.getElementById('win-name').innerText = `${currentFrag.Brand} - ${currentFrag.Perfume}`;
                document.getElementById('win-modal').classList.remove('hidden');
            } else {
                document.getElementById('lose-name').innerText = `${currentFrag.Brand} - ${currentFrag.Perfume}`;
                document.getElementById('lose-modal').classList.remove('hidden');
            }
        }

        window.onclick = (e) => {
            if (!e.target.matches('#guess-input')) document.getElementById('autocomplete-list').classList.add('hidden');
        };

        loadGame();
    </script>
</body>
</html>
